<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>选择番剧类型 - B站番剧分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="genre_selection.css" rel="stylesheet">
</head>
<body>
<div class="banner"></div>
<div class="anime-bg">
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://i.pinimg.com/originals/42/38/75/4238754d8d8d7b5b6d2c1a0b5a6a4a4f.jpg') center/cover no-repeat;"></div>
</div>

<div class="bilibili-logo">
    <i class="fab fa-bilibili"></i>
    <span>番剧分析系统</span>
</div>

<div class="selection-container">
    <div class="selection-header">
        <h2>选择您感兴趣的番剧类型</h2>
        <p>滑动浏览并选择多个您喜欢的类型</p>
    </div>

    <div class="user-info">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="username" id="username">番剧爱好者</div>
    </div>

    <div class="loading-container" id="loadingIndicator">
        <div>
            <div class="loading-spinner"></div>
            <div class="loading-text">正在加载番剧类型数据...</div>
        </div>
    </div>

    <div class="error-message" id="errorMessage" style="display: none;"></div>

    <div class="genre-carousel-container">
        <button class="carousel-btn prev-btn" id="prevBtn">
            <i class="fas fa-chevron-left"></i>
        </button>

        <div class="genre-carousel" id="genreCarousel">
            <div class="carousel-track" id="carouselTrack">
            </div>
        </div>

        <button class="carousel-btn next-btn" id="nextBtn">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <div class="selection-info">
        <div class="selected-count" id="selectedCount">已选择 0 个类型</div>
    </div>

    <div class="btn-container">
        <button class="btn-select-all" id="selectAllBtn">全选所有类型</button>
        <button class="btn-clear" id="clearBtn">清空已选</button>
        <button class="btn-confirm" disabled id="confirmBtn">确认选择</button>
    </div>
</div>

<div class="footer">
    &copy; 2023 B站番剧分析系统 | 基于本地数据
</div>

<script src="genre_selection.js"></script>
</body>
</html>
