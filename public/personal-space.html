<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>个人空间 - Bilibili 智能分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="personal-space.css" rel="stylesheet">
</head>
<body>
<!-- 顶部导航栏 -->
<header class="header">
    <div class="container">
        <div class="d-flex justify-content-center align-items-center">
            <div class="d-flex align-items-center">
                <img
                        alt="B站Logo"
                        class="logo"
                        src="https://www.bilibili.com/favicon.ico"
                />
                <h3 class="mb-0">Bilibili 智能分析平台</h3>
            </div>
        </div>
    </div>
</header>

<!-- 个人空间内容 -->
<div class="container">
    <div class="personal-space">
        <div class="profile-header">
            <div>
                <h2>个人空间</h2>
                <p>欢迎回来，<span id="current-user">用户</span></p>
            </div>
        </div>

        <div class="profile-content">
            <div class="profile-info">
                <div class="profile-avatar">
                    <i class="fa fa-user"></i>
                </div>

                <div class="profile-details">
                    <div class="profile-detail-item">
                        <h4>用户ID</h4>
                        <p id="user-id">加载中...</p>
                    </div>
                    <div class="profile-detail-item">
                        <h4>用户名</h4>
                        <p id="user-username">加载中...</p>
                    </div>
                    <div class="profile-detail-item">
                        <h4>邮箱</h4>
                        <p id="user-email">加载中...</p>
                    </div>
                    <div class="profile-detail-item">
                        <h4>偏好设置</h4>
                        <p id="user-preferences">加载中...</p>
                    </div>
                    <div class="profile-detail-item">
                        <h4>注册时间</h4>
                        <p id="user-created-at">加载中...</p>
                    </div>
                </div>
            </div>

            <div class="enter-recommendation" id="update-preferences">
                <i class="fa fa-edit"></i>
                <h3>更改用户喜好</h3>
                <p>更新您的番剧偏好设置</p>
            </div>

            <div class="enter-recommendation" id="enter-data-analysis">
                <i class="fa fa-bar-chart"></i>
                <h3>返回数据分析系统</h3>
                <p>查看番剧数据分析</p>
            </div>

            <div class="enter-recommendation" id="enter-dashboard">
                <i class="fa fa-dashboard"></i>
                <h3>数据大屏</h3>
                <p>查看数据可视化大屏</p>
            </div>
        </div>
    </div>
</div>

<!-- 偏好设置模态框 -->
<div aria-hidden="true" aria-labelledby="preferencesModalLabel" class="modal fade" id="preferencesModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="preferencesModalLabel">更改番剧偏好</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <div class="selection-info mb-3">
                    <div class="selected-count" id="modalSelectedCount">已选择 0 个类型</div>
                </div>

                <div class="genre-grid">
                    <!-- 类型卡片将通过JS动态生成 -->
                </div>

                <div class="btn-container mt-4">
                    <button class="btn btn-secondary" id="modalSelectAllBtn">全选所有类型</button>
                    <button class="btn btn-secondary" id="modalClearBtn">清空已选</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">取消</button>
                <button class="btn btn-primary" id="modalConfirmBtn" type="button">保存更改</button>
            </div>
        </div>
    </div>
</div>

<!-- 加载指示器 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3">保存中...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="personal-space.js"></script>
</body>
</html>
