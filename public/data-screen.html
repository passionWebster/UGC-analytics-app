<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>数据大屏 - Bilibili 智能分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="data-screen.css" rel="stylesheet"/>
</head>

<body>
<div class="screen-container">
    <!-- Header -->
    <header class="screen-header">
        <div class="header-left">
            <img alt="B站Logo" class="logo-icon" src="https://www.bilibili.com/favicon.ico"/>
            <h1 class="screen-title">Bilibili 智能分析平台 - 数据大屏</h1>
        </div>
        <div class="header-center">
            <div class="current-time" id="currentTime">2024-01-01 00:00:00</div>
        </div>
        <div class="header-right">
            <button class="btn-back" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i> 返回主页
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="screen-content">
        <!-- Top Row - Key Metrics -->
        <div class="metrics-row">
            <div class="metric-card">
                <div class="metric-icon bg-gradient-pink">
                    <i class="fas fa-film"></i>
                </div>
                <div class="metric-content">
                    <div class="metric-label">番剧总数</div>
                    <div class="metric-value" id="totalAnime">
                        <span class="loading-spinner"></span>
                    </div>
                    <div class="metric-trend" id="animeTrend"></div>
                </div>
            </div>
            <div class="metric-card">
                <div class="metric-icon bg-gradient-blue">
                    <i class="fas fa-play-circle"></i>
                </div>
                <div class="metric-content">
                    <div class="metric-label">总播放量</div>
                    <div class="metric-value" id="totalViews">
                        <span class="loading-spinner"></span>
                    </div>
                    <div class="metric-trend" id="viewsTrend"></div>
                </div>
            </div>
            <div class="metric-card">
                <div class="metric-icon bg-gradient-purple">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="metric-content">
                    <div class="metric-label">总追番数</div>
                    <div class="metric-value" id="totalFollowers">
                        <span class="loading-spinner"></span>
                    </div>
                    <div class="metric-trend" id="followersTrend"></div>
                </div>
            </div>
            <div class="metric-card">
                <div class="metric-icon bg-gradient-yellow">
                    <i class="fas fa-star"></i>
                </div>
                <div class="metric-content">
                    <div class="metric-label">平均评分</div>
                    <div class="metric-value" id="avgRating">
                        <span class="loading-spinner"></span>
                    </div>
                    <div class="metric-trend" id="ratingTrend"></div>
                </div>
            </div>
        </div>

        <!-- Middle Row - Charts -->
        <div class="charts-row">
            <div class="chart-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-chart-pie"></i> 番剧类型分布</h3>
                </div>
                <div class="panel-body">
                    <div id="chartTypeDistribution" style="width: 100%; height: 100%"></div>
                </div>
            </div>
            <div class="chart-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-chart-line"></i> 历年番剧上新趋势</h3>
                </div>
                <div class="panel-body">
                    <div id="chartYearlyTrend" style="width: 100%; height: 100%"></div>
                </div>
            </div>
            <div class="chart-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-chart-bar"></i> 口碑热度TOP10</h3>
                </div>
                <div class="panel-body">
                    <div id="chartTopRated" style="width: 100%; height: 100%"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Row - Rankings and Activity -->
        <div class="bottom-row">
            <div class="ranking-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-trophy"></i> 实时排行榜</h3>
                    <div class="rank-tabs">
                        <button class="rank-tab active" data-type="score">评分</button>
                        <button class="rank-tab" data-type="views">播放</button>
                        <button class="rank-tab" data-type="followers">追番</button>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="ranking-list" id="rankingList">
                        <div class="text-center py-5">加载中...</div>
                    </div>
                </div>
            </div>
            <div class="activity-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-fire"></i> 热门风格组合</h3>
                </div>
                <div class="panel-body">
                    <div id="chartStyleCombo" style="width: 100%; height: 100%"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="data-screen.js"></script>
</body>
</html>
