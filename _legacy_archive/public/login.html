<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>登录 - Bilibili 智能分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="login.css" rel="stylesheet">
</head>
<body>
<!-- 背景动画 -->
<div class="animation-container" id="bubbleContainer"></div>

<div class="login-container">
    <div class="login-header">
        <div class="logo">
            <img alt="B站Logo" src="https://www.bilibili.com/favicon.ico">
        </div>
        <h2>Bilibili 智能分析平台</h2>
        <p>登录以访问您的智能数据分析仪表盘</p>
    </div>

    <div class="login-body">
        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i> 登录成功！正在跳转...
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <div class="input-with-icon">
                    <i class="fas fa-user input-icon"></i>
                    <input class="form-control" id="username" placeholder="请输入用户名" required type="text">
                </div>
                <div class="error-message" id="usernameError">请输入有效的用户名</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock input-icon"></i>
                    <input class="form-control" id="password" placeholder="请输入密码" required type="password">
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                </div>
                <div class="error-message" id="passwordError">密码长度至少为6个字符</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="captcha">验证码</label>
                <div class="captcha-container">
                    <input class="captcha-input" id="captcha" placeholder="请输入验证码" required type="text">
                    <div class="captcha-img" id="captchaImage" onclick="refreshCaptcha()">1234</div>
                </div>
                <div class="error-message" id="captchaError">请输入正确的验证码</div>
            </div>

            <div class="remember-forgot">
                <div class="form-check">
                    <input class="form-check-input" id="rememberMe" type="checkbox">
                    <label class="form-check-label" for="rememberMe">记住我</label>
                </div>

                <a class="forgot-password" href="#">忘记密码?</a>
            </div>

            <button class="btn-login" type="submit">登录</button>
        </form>

        <div class="divider">
            <span class="divider-text">或使用以下方式登录</span>
        </div>

        <div class="social-login">
            <div class="social-btn qq">
                <i class="fab fa-qq"></i>
            </div>
            <div class="social-btn weibo">
                <i class="fab fa-weibo"></i>
            </div>
            <div class="social-btn wechat">
                <i class="fab fa-weixin"></i>
            </div>
        </div>

        <div class="register-link">
            还没有账号? <a href="#" id="showRegister">立即注册</a>
        </div>
    </div>

    <div class="login-footer">
        <p>© 2023 B站番剧分析系统 | 数据驱动决策</p>
    </div>
</div>

<!-- 注册模态框 -->
<div aria-hidden="true" class="modal fade" id="registerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">注册B站番剧分析账号</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user input-icon"></i>
                            <label for="registerUsername"></label><input class="form-control" id="registerUsername"
                                                                         placeholder="设置您的用户名"
                                                                         required type="text">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">邮箱</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope input-icon"></i>
                            <label for="registerEmail"></label><input class="form-control" id="registerEmail"
                                                                      placeholder="输入您的邮箱" required
                                                                      type="email">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock input-icon"></i>
                            <label for="registerPassword"></label><input class="form-control" id="registerPassword"
                                                                         placeholder="设置您的密码"
                                                                         required type="password">
                            <i class="fas fa-eye password-toggle" id="toggleRegisterPassword"></i>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认密码</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock input-icon"></i>
                            <label for="registerConfirmPassword"></label><input class="form-control"
                                                                                id="registerConfirmPassword"
                                                                                placeholder="再次输入密码"
                                                                                required type="password">
                        </div>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" id="acceptTerms" required type="checkbox">
                        <label class="form-check-label" for="acceptTerms">
                            我已阅读并同意 <a class="text-primary" href="#">服务条款</a> 和 <a class="text-primary"
                                                                                               href="#">隐私政策</a>
                        </label>
                    </div>
                    <button class="btn-login" type="submit">注册</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="login.js"></script>
</body>
</html>
